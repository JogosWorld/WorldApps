<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldApps</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0d1117;
    color:#fff;
    min-height:100vh;
    transition:.2s;
}

body.light{
    background:#f3f5f8;
    color:#111;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    height:70px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:1000;
}

body.light header{
    background:#fff;
    border-color:#ddd;
}

.logo{
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
}

.logo span{
    color:#00bfff;
}

.menu{
    display:flex;
    gap:8px;
}

.menu button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:#252b33;
    color:#fff;
}

body.light .menu button{
    background:#e8ebef;
    color:#111;
}

.menu button:hover{
    background:#00bfff;
    color:#fff;
}

/* PÁGINAS */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* HOME */

.hero{
    text-align:center;
    padding:70px 20px 40px;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero h1 span{
    color:#00bfff;
}

.hero p{
    color:#aeb6c2;
    font-size:18px;
}

body.light .hero p{
    color:#666;
}

.search{
    max-width:750px;
    margin:35px auto;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    padding:17px;
    border-radius:13px;
    border:1px solid #30363d;
    background:#161b22;
    color:#fff;
    font-size:16px;
    outline:none;
}

body.light .search input{
    background:#fff;
    color:#111;
    border-color:#ccc;
}

.search button{
    border:0;
    border-radius:13px;
    padding:0 22px;
    background:#00bfff;
    color:#fff;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 60px;
}

/* CATEGORIAS */

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0 35px;
}

.categories button{
    border:1px solid #30363d;
    border-radius:20px;
    padding:10px 15px;
    background:#161b22;
    color:#fff;
}

body.light .categories button{
    background:#fff;
    color:#111;
    border-color:#ccc;
}

.categories button:hover{
    background:#00bfff;
    color:#fff;
}

/* APPS */

.apps{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:18px;
    padding:22px;
    transition:.2s;
}

body.light .card{
    background:#fff;
    border-color:#ddd;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#00bfff;
}

.icon{
    width:62px;
    height:62px;
    border-radius:16px;
    background:#252b33;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:31px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#aeb6c2;
    line-height:1.4;
    min-height:48px;
    margin-bottom:18px;
}

body.light .card p{
    color:#666;
}

.cardButtons{
    display:flex;
    gap:8px;
}

.open{
    flex:1;
    border:0;
    border-radius:10px;
    padding:11px;
    background:#00bfff;
    color:#fff;
    font-weight:bold;
}

.favorite{
    width:45px;
    border:0;
    border-radius:10px;
    background:#252b33;
    color:#fff;
    font-size:19px;
}

body.light .favorite{
    background:#e7eaf0;
    color:#111;
}

/* APP PAGE */

.appPage{
    max-width:1050px;
    margin:35px auto;
    padding:0 20px 60px;
}

.back{
    border:0;
    border-radius:10px;
    padding:11px 18px;
    background:#252b33;
    color:#fff;
    margin-bottom:20px;
}

body.light .back{
    background:#e2e6eb;
    color:#111;
}

.appHeader{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
}

body.light .appHeader{
    background:#fff;
    border-color:#ddd;
}

.appHeader h1{
    margin-bottom:8px;
}

.appHeader p{
    color:#aeb6c2;
}

body.light .appHeader p{
    color:#666;
}

.workspace{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:18px;
    padding:25px;
    min-height:400px;
}

body.light .workspace{
    background:#fff;
    border-color:#ddd;
}

/* CAMPOS */

.input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#fff;
    outline:none;
}

body.light .input{
    background:#f5f6f8;
    color:#111;
}

.action{
    border:0;
    border-radius:10px;
    background:#00bfff;
    color:#fff;
    padding:12px 18px;
    font-weight:bold;
}

.secondary{
    border:1px solid #3b424d;
    border-radius:10px;
    background:#252b33;
    color:#fff;
    padding:10px 15px;
}

body.light .secondary{
    background:#e9edf2;
    color:#111;
}

/* RESULTADOS */

.result{
    background:#252b33;
    border-radius:12px;
    padding:18px;
    margin-top:18px;
    min-height:60px;
}

body.light .result{
    background:#edf0f4;
}

/* TASKS */

.task{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#252b33;
    padding:13px;
    border-radius:10px;
    margin-top:10px;
}

body.light .task{
    background:#edf0f4;
}

.delete{
    border:0;
    border-radius:7px;
    padding:7px 10px;
    background:#ef4444;
    color:#fff;
}

/* AI */

.aiChat{
    height:300px;
    overflow-y:auto;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
}

body.light .aiChat{
    background:#f5f6f8;
}

.message{
    max-width:85%;
    padding:12px 15px;
    border-radius:14px;
    margin-bottom:10px;
    line-height:1.45;
}

.aiMessage{
    background:#252b33;
}

.userMessage{
    background:#00bfff;
    margin-left:auto;
}

.aiInputArea{
    display:flex;
    gap:8px;
}

.aiInputArea input{
    margin:0;
}

/* FINANÇAS */

.moneyStats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:#252b33;
    border-radius:12px;
    padding:18px;
}

body.light .stat{
    background:#edf0f4;
}

.stat strong{
    display:block;
    font-size:24px;
    margin-top:7px;
}

/* NOTAS */

.noteArea{
    width:100%;
    height:250px;
    resize:vertical;
}

/* FAVORITOS */

.empty{
    padding:35px;
    text-align:center;
    color:#999;
}

/* RESPONSIVO */

@media(max-width:700px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:18px;
    }

    .menu button{
        padding:8px;
        font-size:12px;
    }

    .hero h1{
        font-size:35px;
    }

    .search{
        flex-direction:column;
    }

    .search button{
        padding:14px;
    }

    .moneyStats{
        grid-template-columns:1fr;
    }

    .aiInputArea{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo" id="logo">
        🌍 <span>WorldApps</span>
    </div>

    <div class="menu">

        <button id="homeButton">🏠 Início</button>

        <button id="favoritesButton">⭐ Favoritos</button>

        <button id="themeButton">🌙 Tema</button>

    </div>

</header>


<!-- ================= HOME ================= -->

<section id="homePage" class="page active">

    <div class="hero">

        <h1>
            Tudo o que o mundo <span>precisa.</span>
        </h1>

        <p>
            Aplicações úteis num só lugar.
        </p>

        <div class="search">

            <input
                id="searchInput"
                placeholder="Pesquisar aplicações..."
            >

            <button id="searchButton">
                🔎 Pesquisar
            </button>

        </div>

    </div>


    <div class="container">

        <h2>📂 Categorias</h2>

        <div class="categories">

            <button data-category="Todos">Todos</button>
            <button data-category="IA">🤖 IA</button>
            <button data-category="Educação">📚 Educação</button>
            <button data-category="Finanças">💰 Finanças</button>
            <button data-category="Produtividade">⚡ Produtividade</button>
            <button data-category="Casa">🏠 Casa</button>
            <button data-category="Segurança">🔐 Segurança</button>
            <button data-category="Entretenimento">🎮 Entretenimento</button>
            <button data-category="Notas">📝 Notas</button>

        </div>

        <h2>🚀 Aplicações</h2>

        <div id="apps" class="apps"></div>

    </div>

</section>


<!-- ================= APP ================= -->

<section id="appPage" class="page">

    <div class="appPage">

        <button id="backButton" class="back">
            ← Voltar
        </button>

        <div class="appHeader">

            <h1 id="appTitle"></h1>

            <p id="appDescription"></p>

        </div>

        <div id="workspace" class="workspace"></div>

    </div>

</section>


<!-- ================= FAVORITOS ================= -->

<section id="favoritesPage" class="page">

    <div class="container">

        <h1 style="padding-top:40px;margin-bottom:25px">
            ⭐ Os meus favoritos
        </h1>

        <div id="favorites" class="apps"></div>

    </div>

</section>


<script>

/* =====================================================
   LISTA DE APLICAÇÕES
===================================================== */

const applications = [

    {
        id:"ai",
        icon:"🤖",
        name:"World AI",
        category:"IA",
        description:"O assistente inteligente do WorldApps."
    },

    {
        id:"study",
        icon:"📚",
        name:"Estudar",
        category:"Educação",
        description:"Organiza estudos, matérias e tarefas."
    },

    {
        id:"money",
        icon:"💰",
        name:"Gestor de Dinheiro",
        category:"Finanças",
        description:"Controla receitas, despesas e saldo."
    },

    {
        id:"productivity",
        icon:"⚡",
        name:"Produtividade",
        category:"Produtividade",
        description:"Organiza as tuas tarefas e prioridades."
    },

    {
        id:"house",
        icon:"🏠",
        name:"Minha Casa",
        category:"Casa",
        description:"Organiza tarefas e coisas da tua casa."
    },

    {
        id:"security",
        icon:"🔐",
        name:"Segurança",
        category:"Segurança",
        description:"Ferramentas para melhorar a segurança digital."
    },

    {
        id:"games",
        icon:"🎮",
        name:"Entretenimento",
        category:"Entretenimento",
        description:"Jogos simples para te divertires."
    },

    {
        id:"notes",
        icon:"📝",
        name:"Notas",
        category:"Notas",
        description:"Cria e guarda as tuas notas."
    }

];


/* =====================================================
   ESTADO
===================================================== */

let favorites =
    JSON.parse(
        localStorage.getItem("worldapps_favorites") || "[]"
    );


/* =====================================================
   ELEMENTOS
===================================================== */

const homePage =
    document.getElementById("homePage");

const appPage =
    document.getElementById("appPage");

const favoritesPage =
    document.getElementById("favoritesPage");

const appsContainer =
    document.getElementById("apps");

const favoritesContainer =
    document.getElementById("favorites");

const workspace =
    document.getElementById("workspace");


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function showPage(page){

    homePage.classList.remove("active");
    appPage.classList.remove("active");
    favoritesPage.classList.remove("active");

    page.classList.add("active");

    window.scrollTo(0,0);
}


/* =====================================================
   FAVORITOS
===================================================== */

function saveFavorites(){

    localStorage.setItem(
        "worldapps_favorites",
        JSON.stringify(favorites)
    );

}


function toggleFavorite(id){

    if(favorites.includes(id)){

        favorites =
            favorites.filter(
                item => item !== id
            );

    }else{

        favorites.push(id);

    }

    saveFavorites();

    renderApps(applications);

    renderFavorites();

}


/* =====================================================
   CARTÃO
===================================================== */

function createCard(app){

    const card =
        document.createElement("div");

    card.className = "card";

    const favorite =
        favorites.includes(app.id);


    card.innerHTML = `

        <div class="icon">
            ${app.icon}
        </div>

        <h3>
            ${app.name}
        </h3>

        <p>
            ${app.description}
        </p>

        <div class="cardButtons">

            <button
                class="open"
                data-open="${app.id}">
                Abrir aplicação
            </button>

            <button
                class="favorite"
                data-favorite="${app.id}">
                ${favorite ? "★" : "☆"}
            </button>

        </div>

    `;

    return card;
}


/* =====================================================
   MOSTRAR APPS
===================================================== */

function renderApps(list){

    appsContainer.innerHTML = "";


    if(list.length === 0){

        appsContainer.innerHTML =
            '<div class="empty">😕 Nenhuma aplicação encontrada.</div>';

        return;

    }


    list.forEach(app => {

        appsContainer.appendChild(
            createCard(app)
        );

    });

}


/* =====================================================
   FAVORITOS
===================================================== */

function renderFavorites(){

    favoritesContainer.innerHTML = "";


    const list =
        applications.filter(
            app => favorites.includes(app.id)
        );


    if(list.length === 0){

        favoritesContainer.innerHTML =
            '<div class="empty">Ainda não tens aplicações favoritas.</div>';

        return;

    }


    list.forEach(app => {

        favoritesContainer.appendChild(
            createCard(app)
        );

    });

}


/* =====================================================
   ABRIR APLICAÇÃO
===================================================== */

function openApplication(id){

    const app =
        applications.find(
            item => item.id === id
        );


    if(!app){
        return;
    }


    document.getElementById("appTitle").textContent =
        app.icon + " " + app.name;

    document.getElementById("appDescription").textContent =
        app.description;

    workspace.innerHTML = "";


    /* ================= WORLD AI ================= */

    if(id === "ai"){

        workspace.innerHTML = `

            <h2>🤖 World AI</h2>

            <p style="margin:10px 0 18px">
                Fala com o assistente do WorldApps.
            </p>

            <div id="aiChat" class="aiChat">

                <div class="message aiMessage">
                    🤖 Olá! Eu sou o World AI. Como posso ajudar?
                </div>

            </div>

            <div class="aiInputArea">

                <input
                    id="aiInput"
                    class="input"
                    placeholder="Escreve a tua pergunta..."
                >

                <button id="aiSend" class="action">
                    Enviar
                </button>

            </div>

            <div style="margin-top:15px">

                <button class="secondary aiSuggestion"
                    data-question="Dá-me uma ideia para uma aplicação.">
                    💡 Ideia
                </button>

                <button class="secondary aiSuggestion"
                    data-question="Ajuda-me a organizar o meu dia.">
                    📅 Organizar o dia
                </button>

                <button class="secondary aiSuggestion"
                    data-question="Explica-me o que é inteligência artificial.">
                    🧠 Explicar IA
                </button>

            </div>

            <button
                id="newChat"
                class="secondary"
                style="margin-top:15px">
                🗑️ Nova conversa
            </button>

        `;


        const chat =
            document.getElementById("aiChat");


        function sendAI(){

            const input =
                document.getElementById("aiInput");

            const question =
                input.value.trim();


            if(!question){
                return;
            }


            const user =
                document.createElement("div");

            user.className =
                "message userMessage";

            user.textContent =
                question;

            chat.appendChild(user);


            const answer =
                document.createElement("div");

            answer.className =
                "message aiMessage";


            answer.textContent =
                getAIResponse(question);


            chat.appendChild(answer);

            input.value = "";

            chat.scrollTop =
                chat.scrollHeight;

        }


        document
        .getElementById("aiSend")
        .onclick = sendAI;


        document
        .getElementById("aiInput")
        .onkeydown = function(event){

            if(event.key === "Enter"){
                sendAI();
            }

        };


        document
        .querySelectorAll(".aiSuggestion")
        .forEach(button => {

            button.onclick = function(){

                document
                .getElementById("aiInput")
                .value =
                    button.dataset.question;

                sendAI();

            };

        });


        document
        .getElementById("newChat")
        .onclick = function(){

            chat.innerHTML = `

                <div class="message aiMessage">
                    🤖 Nova conversa iniciada. Como posso ajudar?
                </div>

            `;

        };

    }


    /* ================= ESTUDAR ================= */

    else if(id === "study"){

        createTaskApp(
            "📚 Estudar",
            "Adiciona uma matéria ou tarefa de estudo."
        );

    }


    /* ================= PRODUTIVIDADE ================= */

    else if(id === "productivity"){

        createTaskApp(
            "⚡ Produtividade",
            "Organiza as tarefas que tens para fazer."
        );

    }


    /* ================= CASA ================= */

    else if(id === "house"){

        createTaskApp(
            "🏠 Minha Casa",
            "Adiciona tarefas, compras ou coisas importantes."
        );

    }


    /* ================= DINHEIRO ================= */

    else if(id === "money"){

        workspace.innerHTML = `

            <h2>💰 Gestor de Dinheiro</h2>

            <div class="moneyStats">

                <div class="stat">
                    Receitas
                    <strong id="income">0,00 €</strong>
                </div>

                <div class="stat">
                    Despesas
                    <strong id="expenses">0,00 €</strong>
                </div>

                <div class="stat">
                    Saldo
                    <strong id="balance">0,00 €</strong>
                </div>

            </div>

            <h3>Adicionar movimento</h3>

            <select id="moneyType" class="input">
                <option value="expense">Despesa</option>
                <option value="income">Receita</option>
            </select>

            <input
                id="moneyValue"
                class="input"
                type="number"
                placeholder="Valor (€)"
            >

            <input
                id="moneyDescription"
                class="input"
                placeholder="Descrição"
            >

            <button id="moneyAdd" class="action">
                Adicionar
            </button>

            <div id="moneyHistory" style="margin-top:20px"></div>

        `;


        let income = 0;
        let expenses = 0;


        document
        .getElementById("moneyAdd")
        .onclick = function(){

            const value =
                Number(
                    document.getElementById("moneyValue").value
                );


            const type =
                document.getElementById("moneyType").value;


            const description =
                document
                .getElementById("moneyDescription")
                .value
                .trim() || "Movimento";


            if(value <= 0){
                return;
            }


            if(type === "income"){
                income += value;
            }else{
                expenses += value;
            }


            document.getElementById("income")
                .textContent =
                income.toFixed(2) + " €";


            document.getElementById("expenses")
                .textContent =
                expenses.toFixed(2) + " €";


            document.getElementById("balance")
                .textContent =
                (income - expenses).toFixed(2) + " €";


            const item =
                document.createElement("div");

            item.className = "task";

            item.innerHTML = `

                <span>
                    ${type === "income" ? "🟢" : "🔴"}
                    ${description}
                </span>

                <strong>
                    ${value.toFixed(2)} €
                </strong>

            `;


            document
            .getElementById("moneyHistory")
            .prepend(item);


            document.getElementById("moneyValue").value = "";
            document.getElementById("moneyDescription").value = "";

        };

    }


    /* ================= SEGURANÇA ================= */

    else if(id === "security"){

        workspace.innerHTML = `

            <h2>🔐 Segurança</h2>

            <p style="margin:10px 0">
                Verifica a força de uma palavra-passe.
            </p>

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Escreve uma palavra-passe"
            >

            <button id="checkPassword" class="action">
                Verificar
            </button>

            <div id="passwordResult" class="result">
                Ainda não verificaste.
            </div>

            <hr style="margin:25px 0;border-color:#30363d">

            <h3>🔑 Gerador de palavra-passe</h3>

            <button id="generatePassword"
                class="action"
                style="margin-top:15px">
                Gerar palavra-passe
            </button>

            <div id="generatedPassword" class="result">
                Clica para gerar.
            </div>

        `;


        document
        .getElementById("checkPassword")
        .onclick = function(){

            const password =
                document.getElementById("password").value;


            let points = 0;


            if(password.length >= 8) points++;
            if(/[A-Z]/.test(password)) points++;
            if(/[0-9]/.test(password)) points++;
            if(/[^A-Za-z0-9]/.test(password)) points++;


            let result;


            if(points <= 1){
                result = "🔴 Fraca";
            }
            else if(points === 2){
                result = "🟠 Média";
            }
            else if(points === 3){
                result = "🟢 Boa";
            }
            else{
                result = "🟢 Muito forte";
            }


            document
            .getElementById("passwordResult")
            .textContent =
                "Força: " + result;

        };


        document
        .getElementById("generatePassword")
        .onclick = function(){

            const chars =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*";

            let password = "";


            for(let i=0;i<14;i++){

                password +=
                    chars[
                        Math.floor(
                            Math.random()*chars.length
                        )
                    ];

            }


            document
            .getElementById("generatedPassword")
            .textContent =
                password;

        };

    }


    /* ================= JOGO ================= */

    else if(id === "games"){

        let number =
            Math.floor(Math.random()*100)+1;


        workspace.innerHTML = `

            <h2>🎮 Adivinha o número</h2>

            <p style="margin:10px 0">
                Estou a pensar num número entre 1 e 100.
            </p>

            <input
                id="guess"
                class="input"
                type="number"
                placeholder="Escreve um número"
            >

            <button id="guessButton" class="action">
                Tentar
            </button>

            <div id="gameResult" class="result">
                Boa sorte!
            </div>

        `;


        document
        .getElementById("guessButton")
        .onclick = function(){

            const guess =
                Number(
                    document.getElementById("guess").value
                );


            const result =
                document.getElementById("gameResult");


            if(!guess){
                result.textContent =
                    "Escreve um número.";
                return;
            }


            if(guess === number){

                result.textContent =
                    "🎉 Acertaste! Vou escolher outro número.";

                number =
                    Math.floor(Math.random()*100)+1;

            }
            else if(guess < number){

                result.textContent =
                    "⬆️ O número é maior.";

            }
            else{

                result.textContent =
                    "⬇️ O número é menor.";

            }

        };

    }


    /* ================= NOTAS ================= */

    else if(id === "notes"){

        workspace.innerHTML = `

            <h2>📝 Notas</h2>

            <textarea
                id="notesArea"
                class="input noteArea"
                placeholder="Escreve aqui..."
            ></textarea>

            <button id="saveNotes" class="action">
                💾 Guardar notas
            </button>

            <button id="clearNotes" class="secondary">
                🗑️ Limpar
            </button>

            <div id="notesResult" class="result">
                As notas são guardadas neste navegador.
            </div>

        `;


        document.getElementById("notesArea").value =
            localStorage.getItem("worldapps_notes") || "";


        document
        .getElementById("saveNotes")
        .onclick = function(){

            localStorage.setItem(
                "worldapps_notes",
                document.getElementById("notesArea").value
            );


            document
            .getElementById("notesResult")
            .textContent =
                "✅ Notas guardadas.";

        };


        document
        .getElementById("clearNotes")
        .onclick = function(){

            document.getElementById("notesArea").value = "";

        };

    }


    showPage(appPage);

}


/* =====================================================
   RESPOSTAS DA WORLD AI
===================================================== */

function getAIResponse(question){

    const q =
        question.toLowerCase();


    if(
        q.includes("olá") ||
        q.includes("ola") ||
        q.includes("oi")
    ){

        return "🤖 Olá! É um prazer falar contigo. O que precisas de fazer?";

    }


    if(
        q.includes("ideia") &&
        q.includes("aplica")
    ){

        return "💡 Uma ideia: uma aplicação que junta tarefas, calendário, despesas e IA num único painel.";

    }


    if(
        q.includes("inteligência artificial") ||
        q.includes("inteligencia artificial") ||
        q.includes("ia")
    ){

        return "🧠 A inteligência artificial permite que computadores analisem informação e realizem tarefas que normalmente precisam de capacidades humanas, como compreender texto, reconhecer padrões e gerar conteúdo.";

    }


    if(
        q.includes("estudar") ||
        q.includes("estudo")
    ){

        return "📚 Para estudar, experimenta dividir o trabalho em sessões de 25 minutos, fazer pequenas pausas e guardar as tarefas no WorldApps.";

    }


    if(
        q.includes("dia") ||
        q.includes("organizar")
    ){

        return "📅 Podes organizar o dia em três grupos: urgente, importante e se houver tempo. Começa pelas tarefas mais importantes.";

    }


    if(
        q.includes("worldapps")
    ){

        return "🌍 O WorldApps é uma plataforma onde podemos juntar várias aplicações úteis num só lugar.";

    }


    return "🤖 Ainda estou a aprender. Podes explicar a pergunta de outra forma ou experimentar uma das sugestões acima.";

}


/* =====================================================
   APLICAÇÕES DE TAREFAS
===================================================== */

function createTaskApp(title,description){

    workspace.innerHTML = `

        <h2>${title}</h2>

        <p style="margin:10px 0 15px">
            ${description}
        </p>

        <input
            id="taskInput"
            class="input"
            placeholder="Escreve uma tarefa..."
        >

        <button id="taskAdd" class="action">
            ➕ Adicionar
        </button>

        <div id="taskList"></div>

    `;


    document
    .getElementById("taskAdd")
    .onclick = function(){

        const input =
            document.getElementById("taskInput");


        const text =
            input.value.trim();


        if(!text){
            return;
        }


        const task =
            document.createElement("div");

        task.className = "task";


        const span =
            document.createElement("span");

        span.textContent =
            "📌 " + text;


        const remove =
            document.createElement("button");

        remove.textContent = "X";
        remove.className = "delete";


        remove.onclick = function(){

            task.remove();

        };


        task.appendChild(span);
        task.appendChild(remove);


        document
        .getElementById("taskList")
        .appendChild(task);


        input.value = "";

    };

}

/* =====================================================
   PESQUISA
===================================================== */

function searchApps(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const result =
        applications.filter(app =>

            app.name.toLowerCase().includes(query) ||

            app.description.toLowerCase().includes(query) ||

            app.category.toLowerCase().includes(query)

        );


    renderApps(result);

}


document
.getElementById("searchButton")
.onclick = searchApps;


document
.getElementById("searchInput")
.onkeydown = function(event){

    if(event.key === "Enter"){

        searchApps();

    }

};


/* =====================================================
   CATEGORIAS
===================================================== */

document
.querySelectorAll("[data-category]")
.forEach(button => {

    button.onclick = function(){

        const category =
            button.dataset.category;


        if(category === "Todos"){

            renderApps(applications);

            return;

        }


        const result =
            applications.filter(
                app => app.category === category
            );


        renderApps(result);

    };

});


/* =====================================================
   INICIAR
===================================================== */

renderApps(applications);

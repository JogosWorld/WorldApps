<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorldApps</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#101318;
    color:white;
    min-height:100vh;
}

body.light{
    background:#f2f4f7;
    color:#111;
}

header{
    height:70px;
    background:#191d24;
    border-bottom:1px solid #303641;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
}

body.light header{
    background:white;
    border-color:#ddd;
}

.logo{
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
}

.logo span{
    color:#00bfff;
}

.menu{
    display:flex;
    gap:8px;
}

button{
    cursor:pointer;
    font-family:Arial,sans-serif;
}

.menu button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:#292e37;
    color:white;
}

body.light .menu button{
    background:#e7eaf0;
    color:#111;
}

.menu button:hover{
    background:#00bfff;
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.hero{
    text-align:center;
    padding:70px 20px 35px;
}

.hero h1{
    font-size:46px;
    margin-bottom:15px;
}

.hero h1 span{
    color:#00bfff;
}

.hero p{
    color:#aeb5c0;
    font-size:18px;
}

body.light .hero p{
    color:#666;
}

.search{
    max-width:700px;
    margin:35px auto;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    padding:16px;
    border-radius:12px;
    border:1px solid #363d49;
    background:#191d24;
    color:white;
    font-size:16px;
    outline:none;
}

body.light .search input{
    background:white;
    color:#111;
}

.search button{
    border:0;
    border-radius:12px;
    background:#00bfff;
    color:white;
    padding:0 20px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 50px;
}

h2{
    margin-bottom:18px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:35px;
}

.categories button{
    border:1px solid #363d49;
    border-radius:20px;
    background:#191d24;
    color:white;
    padding:10px 15px;
}

body.light .categories button{
    background:white;
    color:#111;
    border-color:#ccc;
}

.categories button:hover{
    background:#00bfff;
    color:white;
}

.apps{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.card{
    background:#191d24;
    border:1px solid #303641;
    border-radius:18px;
    padding:22px;
    transition:.2s;
}

body.light .card{
    background:white;
    border-color:#ddd;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#00bfff;
}

.icon{
    width:60px;
    height:60px;
    border-radius:15px;
    background:#292e37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:9px;
}

.card p{
    color:#aeb5c0;
    min-height:45px;
    line-height:1.4;
    margin-bottom:18px;
}

body.light .card p{
    color:#666;
}

.buttons{
    display:flex;
    gap:8px;
}

.open{
    flex:1;
    border:0;
    border-radius:10px;
    background:#00bfff;
    color:white;
    padding:11px;
    font-weight:bold;
}

.favorite{
    width:45px;
    border:0;
    border-radius:10px;
    background:#292e37;
    color:white;
    font-size:19px;
}

body.light .favorite{
    background:#e8ebef;
    color:#111;
}

.appPage{
    max-width:1000px;
    margin:35px auto;
    padding:0 20px 60px;
}

.back{
    border:0;
    border-radius:10px;
    padding:11px 17px;
    background:#292e37;
    color:white;
    margin-bottom:20px;
}

body.light .back{
    background:#e2e6eb;
    color:#111;
}

.appHeader{
    background:#191d24;
    border:1px solid #303641;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
}

body.light .appHeader{
    background:white;
    border-color:#ddd;
}

.appHeader h1{
    margin-bottom:8px;
}

.appHeader p{
    color:#aeb5c0;
}

body.light .appHeader p{
    color:#666;
}

.workspace{
    background:#191d24;
    border:1px solid #303641;
    border-radius:18px;
    padding:25px;
    min-height:350px;
}

body.light .workspace{
    background:white;
    border-color:#ddd;
}

.input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #3b424e;
    background:#101318;
    color:white;
    margin:10px 0;
}

body.light .input{
    background:#f4f5f7;
    color:#111;
}

.action{
    border:0;
    border-radius:10px;
    background:#00bfff;
    color:white;
    padding:12px 18px;
    font-weight:bold;
}

.result{
    background:#292e37;
    border-radius:12px;
    padding:18px;
    margin-top:20px;
    min-height:60px;
}

body.light .result{
    background:#edf0f4;
}

.task{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px;
    margin-top:10px;
    border-radius:10px;
    background:#292e37;
}

body.light .task{
    background:#edf0f4;
}

.delete{
    border:0;
    background:#ef4444;
    color:white;
    border-radius:7px;
    padding:7px 10px;
}

.empty{
    padding:30px;
    text-align:center;
    color:#999;
}

@media(max-width:700px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:18px;
    }

    .menu button{
        padding:8px;
        font-size:12px;
    }

    .hero h1{
        font-size:34px;
    }

    .search{
        flex-direction:column;
    }

    .search button{
        padding:14px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo" id="logo">
        🌍 <span>WorldApps</span>
    </div>

    <div class="menu">

        <button id="homeBtn">
            🏠 Início
        </button>

        <button id="favBtn">
            ⭐ Favoritos
        </button>

        <button id="themeBtn">
            🌙 Tema
        </button>

    </div>

</header>


<!-- INÍCIO -->

<section id="homePage" class="page active">

    <div class="hero">

        <h1>
            Tudo o que o mundo <span>precisa.</span>
        </h1>

        <p>
            Aplicações úteis num só lugar.
        </p>

        <div class="search">

            <input
                id="search"
                type="text"
                placeholder="Pesquisar aplicações..."
            >

            <button id="searchBtn">
                🔎 Pesquisar
            </button>

        </div>

    </div>


    <div class="container">

        <h2>📂 Categorias</h2>

        <div class="categories">

            <button data-category="Todos">Todos</button>
            <button data-category="IA">🤖 IA</button>
            <button data-category="Educação">📚 Educação</button>
            <button data-category="Finanças">💰 Finanças</button>
            <button data-category="Produtividade">⚡ Produtividade</button>
            <button data-category="Casa">🏠 Casa</button>
            <button data-category="Segurança">🔐 Segurança</button>
            <button data-category="Entretenimento">🎮 Entretenimento</button>
            <button data-category="Notas">📝 Notas</button>

        </div>


        <h2>🚀 Aplicações</h2>

        <div id="apps" class="apps"></div>

    </div>

</section>


<!-- APLICAÇÃO -->

<section id="appPage" class="page">

    <div class="appPage">

        <button id="backBtn" class="back">
            ← Voltar
        </button>

        <div class="appHeader">

            <h1 id="appTitle"></h1>

            <p id="appDescription"></p>

        </div>

        <div id="workspace" class="workspace"></div>

    </div>

</section>


<!-- FAVORITOS -->

<section id="favoritesPage" class="page">

    <div class="container">

        <h1 style="margin-top:40px;margin-bottom:25px">
            ⭐ Os meus favoritos
        </h1>

        <div id="favorites" class="apps"></div>

    </div>

</section>


<script>

const applications = [

    {
        id:"ai",
        icon:"🤖",
        name:"World AI",
        category:"IA",
        description:"Um assistente inteligente para responder às tuas perguntas."
    },

    {
        id:"study",
        icon:"📚",
        name:"Estudar",
        category:"Educação",
        description:"Organiza os teus estudos e tarefas escolares."
    },

    {
        id:"money",
        icon:"💰",
        name:"Gestor de Dinheiro",
        category:"Finanças",
        description:"Controla as tuas despesas e o teu dinheiro."
    },

    {
        id:"work",
        icon:"⚡",
        name:"Produtividade",
        category:"Produtividade",
        description:"Cria e organiza as tuas tarefas."
    },

    {
        id:"house",
        icon:"🏠",
        name:"Minha Casa",
        category:"Casa",
        description:"Organiza coisas importantes da tua casa."
    },

    {
        id:"security",
        icon:"🔐",
        name:"Segurança",
        category:"Segurança",
        description:"Verifica a força de uma palavra-passe."
    },

    {
        id:"game",
        icon:"🎮",
        name:"Entretenimento",
        category:"Entretenimento",
        description:"Joga um pequeno jogo dentro do WorldApps."
    },

    {
        id:"notes",
        icon:"📝",
        name:"Notas",
        category:"Notas",
        description:"Escreve e guarda as tuas notas."
    }

];


let favorites =
    JSON.parse(
        localStorage.getItem("worldapps_favorites") || "[]"
    );


const homePage =
    document.getElementById("homePage");

const appPage =
    document.getElementById("appPage");

const favoritesPage =
    document.getElementById("favoritesPage");

const appsContainer =
    document.getElementById("apps");

const favoritesContainer =
    document.getElementById("favorites");

const workspace =
    document.getElementById("workspace");


function saveFavorites(){

    localStorage.setItem(
        "worldapps_favorites",
        JSON.stringify(favorites)
    );

}


function show(page){

    homePage.classList.remove("active");
    appPage.classList.remove("active");
    favoritesPage.classList.remove("active");

    page.classList.add("active");

    window.scrollTo(0,0);

}


function createCard(app){

    const card =
        document.createElement("div");

    card.className = "card";

    const isFavorite =
        favorites.includes(app.id);


    card.innerHTML = `

        <div class="icon">
            ${app.icon}
        </div>

        <h3>
            ${app.name}
        </h3>

        <p>
            ${app.description}
        </p>

        <div class="buttons">

            <button class="open" data-open="${app.id}">
                Abrir aplicação
            </button>

            <button class="favorite" data-favorite="${app.id}">
                ${isFavorite ? "★" : "☆"}
            </button>

        </div>

    `;

    return card;

}


function renderApps(list){

    appsContainer.innerHTML = "";

    if(list.length === 0){

        appsContainer.innerHTML =
            '<div class="empty">😕 Nenhuma aplicação encontrada.</div>';

        return;

    }


    list.forEach(app => {

        appsContainer.appendChild(
            createCard(app)
        );

    });

}


function renderFavorites(){

    favoritesContainer.innerHTML = "";


    const list =
        applications.filter(app =>
            favorites.includes(app.id)
        );


    if(list.length === 0){

        favoritesContainer.innerHTML =
            '<div class="empty">Ainda não tens favoritos.</div>';

        return;

    }


    list.forEach(app => {

        favoritesContainer.appendChild(
            createCard(app)
        );

    });

}


function openApplication(id){

    const app =
        applications.find(item =>
            item.id === id
        );


    if(!app){
        return;
    }


    document.getElementById("appTitle").textContent =
        app.icon + " " + app.name;

    document.getElementById("appDescription").textContent =
        app.description;


    workspace.innerHTML = "";


    if(id === "ai"){

        workspace.innerHTML = `

            <h2>🤖 World AI</h2>

            <p style="margin-top:10px">
                Escreve uma pergunta para o World AI.
            </p>

            <input
                id="aiQuestion"
                class="input"
                placeholder="Ex: O que é inteligência artificial?"
            >

            <button id="askAI" class="action">
                Perguntar
            </button>

            <div id="aiAnswer" class="result">
                O World AI está pronto.
            </div>

        `;


        document
        .getElementById("askAI")
        .onclick = function(){

            const question =
                document
                .getElementById("aiQuestion")
                .value.trim();


            document
            .getElementById("aiAnswer")
            .textContent =
                question
                ? "🤖 World AI recebeu: " + question
                : "Escreve primeiro uma pergunta.";

        };

    }


    else if(id === "study"){

        createTasks(
            "📚 Estudar",
            "studyInput",
            "studyAdd",
            "studyList"
        );

    }


    else if(id === "work"){

        createTasks(
            "⚡ Produtividade",
            "workInput",
            "workAdd",
            "workList"
        );

    }


    else if(id === "house"){

        createTasks(
            "🏠 Minha Casa",
            "houseInput",
            "houseAdd",
            "houseList"
        );

    }


    else if(id === "money"){

        workspace.innerHTML = `

            <h2>💰 Gestor de Dinheiro</h2>

            <input
                id="moneyInput"
                class="input"
                type="number"
                placeholder="Valor da despesa (€)"
            >

            <button id="moneyAdd" class="action">
                Adicionar despesa
            </button>

            <div id="moneyTotal" class="result">
                Total: 0,00 €
            </div>

        `;


        let total = 0;


        document
        .getElementById("moneyAdd")
        .onclick = function(){

            const value =
                Number(
                    document
                    .getElementById("moneyInput")
                    .value
                );


            if(value <= 0){
                return;
            }


            total += value;


            document
            .getElementById("moneyTotal")
            .textContent =
                "Total: " +
                total.toFixed(2) +
                " €";

        };

    }


    else if(id === "security"){

        workspace.innerHTML = `

            <h2>🔐 Segurança</h2>

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Escreve uma palavra-passe"
            >

            <button id="checkPassword" class="action">
                Verificar
            </button>

            <div id="passwordResult" class="result">
                Ainda não verificaste.
            </div>

        `;


        document
        .getElementById("checkPassword")
        .onclick = function(){

            const password =
                document
                .getElementById("password")
                .value;


            let points = 0;


            if(password.length >= 8){
                points++;
            }

            if(/[A-Z]/.test(password)){
                points++;
            }

            if(/[0-9]/.test(password)){
                points++;
            }

            if(/[^A-Za-z0-9]/.test(password)){
                points++;
            }


            let text;


            if(points <= 1){
                text = "🔴 Fraca";
            }
            else if(points === 2){
                text = "🟠 Média";
            }
            else if(points === 3){
                text = "🟢 Boa";
            }
            else{
                text = "🟢 Muito forte";
            }


            document
            .getElementById("passwordResult")
            .textContent =
                "Força: " + text;

        };

    }


    else if(id === "game"){

        let number =
            Math.floor(Math.random()*10)+1;


        workspace.innerHTML = `

            <h2>🎮 Adivinha o número</h2>

            <p style="margin:10px 0">
                Estou a pensar num número entre 1 e 10.
            </p>

            <input
                id="guess"
                class="input"
                type="number"
                min="1"
                max="10"
                placeholder="O teu número"
            >

            <button id="guessButton" class="action">
                Tentar
            </button>

            <div id="gameResult" class="result">
                Boa sorte!
            </div>

        `;


        document
        .getElementById("guessButton")
        .onclick = function(){

            const guess =
                Number(
                    document
                    .getElementById("guess")
                    .value
                );


            if(guess === number){

                document
                .getElementById("gameResult")
                .textContent =
                    "🎉 Acertaste! Novo número escolhido.";

                number =
                    Math.floor(Math.random()*10)+1;

            }
            else{

                document
                .getElementById("gameResult")
                .textContent =
                    "❌ Errado. Tenta novamente.";

            }

        };

    }


    else if(id === "notes"){

        workspace.innerHTML = `

            <h2>📝 Notas</h2>

            <textarea
                id="notes"
                class="input"
                style="height:220px"
                placeholder="Escreve as tuas notas..."
            ></textarea>

            <button id="saveNotes" class="action">
                💾 Guardar
            </button>

            <div id="notesResult" class="result">
                As notas ficam guardadas neste navegador.
            </div>

        `;


        document.getElementById("notes").value =
            localStorage.getItem("worldapps_notes") || "";


        document
        .getElementById("saveNotes")
        .onclick = function(){

            localStorage.setItem(
                "worldapps_notes",
                document.getElementById("notes").value
            );


            document
            .getElementById("notesResult")
            .textContent =
                "✅ Notas guardadas.";

        };

    }


    show(appPage);

}


function createTasks(title,inputId,buttonId,listId){

    workspace.innerHTML = `

        <h2>${title}</h2>

        <input
            id="${inputId}"
            class="input"
            placeholder="Escreve uma tarefa..."
        >

        <button id="${buttonId}" class="action">
            Adicionar
        </button>

        <div id="${listId}"></div>

    `;


    document
    .getElementById(buttonId)
    .onclick = function(){

        const input =
            document.getElementById(inputId);

        const text =
            input.value.trim();


        if(!text){
            return;
        }


        const task =
            document.createElement("div");

        task.className = "task";


        const span =
            document.createElement("span");

        span.textContent =
            "📌 " + text;


        const remove =
            document.createElement("button");

        remove.textContent = "X";

        remove.className = "delete";


        remove.onclick = function(){

            task.remove();

        };


        task.appendChild(span);
        task.appendChild(remove);


        document
        .getElementById(listId)
        .appendChild(task);


        input.value = "";

    };

}


/* CLIQUE NOS BOTÕES DAS APLICAÇÕES */

document.addEventListener("click",function(event){

    const openButton =
        event.target.closest("[data-open]");


    if(openButton){

        openApplication(
            openButton.dataset.open
        );

        return;

    }


    const favoriteButton =
        event.target.closest("[data-favorite]");


    if(favoriteButton){

        const id =
            favoriteButton.dataset.favorite;


        if(favorites.includes(id)){

            favorites =
                favorites.filter(
                    item => item !== id
                );

        }
        else{

            favorites.push(id);

        }


        saveFavorites();

        renderApps(applications);

        renderFavorites();

    }

});


/* INÍCIO */

document
.getElementById("homeBtn")
.onclick = function(){

    show(homePage);

};


/* LOGO */

document
.getElementById("logo")
.onclick = function(){

    show(homePage);

};


/* VOLTAR */

document
.getElementById("backBtn")
.onclick = function(){

    show(homePage);

};


/* FAVORITOS */

document
.getElementById("favBtn")
.onclick = function(){

    renderFavorites();

    show(favoritesPage);

};


/* TEMA */

document
.getElementById("themeBtn")
.onclick = function(){

    document.body.classList.toggle("light");


    localStorage.setItem(
        "worldapps_theme",
        document.body.classList.contains("light")
        ? "light"
        : "dark"
    );

};


if(
    localStorage.getItem("worldapps_theme")
    === "light"
){

    document.body.classList.add("light");

}


/* PESQUISA */

function doSearch(){

    const text =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const result =
        applications.filter(app =>

            app.name.toLowerCase().includes(text) ||

            app.description.toLowerCase().includes(text) ||

            app.category.toLowerCase().includes(text)

        );


    renderApps(result);

}


document
.getElementById("searchBtn")
.onclick = doSearch;


document
.getElementById("search")
.onkeydown = function(event){

    if(event.key === "Enter"){
        doSearch();
    }

};


/* CATEGORIAS */

document
.querySelectorAll("[data-category]")
.forEach(button => {

    button.onclick = function(){

        const category =
            button.dataset.category;


        if(category === "Todos"){

            renderApps(applications);

            return;

        }


        const result =
            applications.filter(
                app => app.category === category
            );


        renderApps(result);

    };

});


/* INICIAR */

renderApps(applications);

</script>

</body>
</html>
